name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 编译 PC 端
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # libs/ 在仓库里是空的（第三方二进制不入库），CI 自己拉一份。
      # 缓存住这个 6.4 MB 的包：既快，也能避开 release CDN 偶发的 504。
      - name: 缓存 LHM 依赖包
        uses: actions/cache@v6
        id: lhm
        with:
          path: lhm.zip
          key: lhm-0.9.6-net472

      - name: 准备第三方依赖（LibreHardwareMonitor 0.9.6）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Test-Zip([string]$p) {
            if (-not (Test-Path $p)) { return $false }
            return (Get-Item $p).Length -gt 5MB
          }

          if (Test-Zip 'lhm.zip') {
            Write-Host '命中缓存，跳过下载'
          } else {
            $url = 'https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/releases/download/v0.9.6/LibreHardwareMonitor.zip'
            $done = $false
            for ($i = 1; $i -le 3; $i++) {
              try {
                Write-Host "下载 LHM，第 $i 次尝试…"
                Invoke-WebRequest -Uri $url -OutFile 'lhm.zip' -TimeoutSec 180
                if (-not (Test-Zip 'lhm.zip')) { throw '下载到的文件大小异常' }
                $done = $true
                break
              } catch {
                Write-Host "失败：$($_.Exception.Message)"
                Remove-Item 'lhm.zip' -ErrorAction SilentlyContinue
                if ($i -eq 3) { throw 'LibreHardwareMonitor 下载失败（已重试 3 次）' }
                Start-Sleep -Seconds (5 * $i)
              }
            }
            if (-not $done) { throw '下载未完成' }
          }

          Expand-Archive 'lhm.zip' -DestinationPath lhm-tmp -Force
          # LHM 的 DLL 全在压缩包根目录；gui 依赖（OxyPlot / Aga.Controls 等）复制过去也无害
          Get-ChildItem lhm-tmp -Filter *.dll | Copy-Item -Destination libs -Force
          Copy-Item lhm-tmp\LibreHardwareMonitorLib.xml libs\ -ErrorAction SilentlyContinue
          if (-not (Test-Path libs\LibreHardwareMonitorLib.dll)) {
            throw '依赖准备失败：LibreHardwareMonitorLib.dll 没解出来'
          }
          "libs 下共 " + (Get-ChildItem libs -Filter *.dll).Count + " 个 DLL"

      - name: 打印编译器版本
        shell: cmd
        run: |
          if not exist "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\vbc.exe" (
            echo [FAIL] 找不到 vbc.exe
            exit /b 1
          )
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\vbc.exe" /help >nul && echo vbc 可用

      # 跑仓库自带的构建脚本，等于同时验证「别人 clone 下来照 README 能编过」
      - name: 编译（build.bat）
        shell: cmd
        run: build.bat

      - name: 校验产物
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'bin\Release\HwMonitor.exe'
          if (-not (Test-Path $exe)) { throw '没有生成 HwMonitor.exe' }
          if (-not (Test-Path 'bin\Release\LibreHardwareMonitorLib.dll')) { throw 'DLL 没有随包复制到 bin\Release' }

          $vi = (Get-Item $exe).VersionInfo
          $vi | Select-Object FileVersion, ProductVersion, FileDescription | Format-List
          if ($vi.FileVersion -ne '2.5.0.0') { throw "文件版本不对：$($vi.FileVersion)" }

          "exe 大小 " + [math]::Round((Get-Item $exe).Length / 1KB) + " KB"
          "bin\Release 共 " + (Get-ChildItem bin\Release).Count + " 个文件"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: HwMonitor-2.5
          path: bin/Release/
          retention-days: 7
